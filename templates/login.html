<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excavator3000 Dashboard Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">EXCAVATOR3000</p>
    <h1>Training control</h1>
    <p class="muted">Enter the token printed when the dashboard starts.</p>
    <form method="post" class="login-form">
      <label for="token">Dashboard token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button type="submit" class="primary">Open dashboard</button>
    </form>
  </main>
</body>
</html>
